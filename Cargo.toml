[workspace]
resolver = "3"
members = [
    "crates/panel",
    "crates/panel_contracts",
    "crates/panel_core",
    "crates/panel_gen",
    "crates/panel_server",
    "crates/sa_auth",
    "crates/sa_ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
license = "BlueOak-1.0.0"
repository = "https://github.com/Service-Arb/panel"
readme = "README.md"

[workspace.dependencies]
panel = { path = "crates/panel", version = "0.1.0" }
panel_contracts = { path = "crates/panel_contracts", version = "0.1.0" }
panel_core = { path = "crates/panel_core", version = "0.1.0" }
panel_server = { path = "crates/panel_server", version = "0.1.0" }
sa_auth = { path = "crates/sa_auth", version = "0.1.0" }

axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
concierge_iam = "0.1.0"
dioxus = { version = "0.7", default-features = false }
ed25519-dalek = "2"
ev_lib = { version = "0.24.2", default-features = false }
eyre = "0.6"
futures = "0.3"
getrandom = "0.3"
hex = "0.4"
hmac = "0.13"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
jiff = "0.2"
pbjson = "0.9"
pbjson-build = "0.9"
pbjson-types = "0.9"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate", "uuid", "json"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["uuid-impl"] }
url = "2"
uuid = "1"
zeroize = "1"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"

[workspace.lints.rust]
unused_features = "allow"

