// sa.funnel.v1 — the events the panel accepts at `POST /api/ingest/v1/events`.
//
// The wire is protojson (the proto3 JSON mapping): field names in lowerCamelCase
// (`occurredAt`, `typeVersion`; the snake_case names are accepted too), `Timestamp` as an
// RFC 3339 string, int64 as a JSON string or number.
//
// Closed vocabularies (source kinds, call outcomes, lead channels, suspect marks, flows) are
// strings rather than proto enums so the JSON carries the words the spec uses (`"site"`,
// `"no_answer"`) and not `SOURCE_KIND_SITE`; the panel checks each against its list and
// rejects any other.
//
// Compatibility: a message here is only ever extended with new optional fields. Anything
// else — a field removed, retyped or made required — is a new `type_version`, a new
// `<Type>V<n>` message beside the old one; old versions stay accepted.
syntax = "proto3";

package sa.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// One fact about the funnel, as a source reports it.
message Event {
  // UUIDv7, issued by the source; the idempotency key. Resending an event with the same
  // id and the same content is answered `duplicate`; with other content, `rejected`.
  string id = 1;
  // Always "sa.funnel.v1".
  string schema = 2;
  // What happened: "lead.created", "call.logged", … A type the panel does not know yet is
  // stored as unregistered, not dropped, and picked up once it is registered.
  string type = 3;
  // Version of `properties` for this type, 1 to 2147483647.
  uint32 type_version = 4;
  // When it happened in the world, not when it was sent.
  google.protobuf.Timestamp occurred_at = 5;
  Source source = 6;
  Subject subject = 7;
  // Checked against the message registered for `type@type_version` (the `…V<n>` messages
  // below). May be omitted when that message has no required fields. At most 16 KiB as
  // JSON, and no NUL character anywhere — for unregistered types too.
  google.protobuf.Struct properties = 8;
  // Name, phone, email, … — kept apart, encrypted at rest, never in reporting. Same limits
  // as `properties`.
  optional google.protobuf.Struct pii = 9;
}

message Source {
  // site | review_archive | gbp | posthog | panel | sheet | telephony | booking | bot. Must be
  // the kind the signing key is registered for. `booking` is the panel's own booking adapters
  // (a provider's webhook or its periodic pull): no key is ever issued for it. `bot` is a
  // messenger bot or auto-responder (docs/BOT-API.md).
  string kind = 1;
  // Which one. For a signed batch, the key id it is signed with ("aquafix-site"); anything
  // else is rejected.
  string id = 2;
}

// What the event is about. Ids are opaque to the panel: 1–128 of [A-Za-z0-9._:-].
message Subject {
  // Lowercase slug, e.g. "aquafix". Must be one of the brands the signing key may write.
  string brand_id = 1;
  optional string location_id = 2;
  // Unique within the brand.
  optional string lead_id = 3;
  optional string job_id = 4;
}

// The body of `POST /api/ingest/v1/events`.
message IngestRequest {
  // 1 to 500 events. Each is judged on its own.
  repeated Event events = 1;
}

// The body of the 207 answer: one result per event, in the request's order.
message IngestResponse {
  repeated EventResult results = 1;
}

message EventResult {
  // Position in the request.
  uint32 index = 1;
  // The event's id as sent; empty when it had none.
  string id = 2;
  // accepted | duplicate | rejected | deferred (not journaled yet: it names what has not
  // arrived; the whole batch is answered 409, to be sent again)
  string status = 3;
  // Why it was rejected; for an accepted event of an unregistered type, that it was stored
  // without being projected.
  optional string reason = 4;
}

// ── properties, one message per type@type_version ──────────────────────────────────────

// lead.created@1 — subject.lead_id required. Written by a site, the panel, or a bot — a bot
// only with channel whatsapp or telegram.
message LeadCreatedV1 {
  // form | phone_inbound | callback | whatsapp | telegram
  string channel = 1;
  // Who typed it in, for leads entered by hand (a panel user id).
  optional string entered_by = 2;
  // rate_limited | too_fast. Set by a landing whose antispam flagged the submission but
  // kept it, since it may still be a real person: `rate_limited` — the visitor's address
  // sent more than the landing allows in its window; `too_fast` — the form was sent sooner
  // after it was shown than a person types. Absent for a lead nothing flagged. A submission
  // caught by the honeypot is dropped by the landing and never sent.
  optional string suspect = 3;
  // What the customer said they need is their words, so it goes in `pii` (as `need`),
  // not here: properties are stored in the clear, `pii` encrypted.

  // The landing's flow for the need (FORM-VARIANTS-SPEC): quote | estimate | fixed. `quote`
  // asks for a price; `estimate` showed one computed from the visitor's choices; `fixed` showed
  // a fixed price. Absent: a landing from before the flows, the same as `quote`.
  optional string flow = 4;
  // The price shown, in integer cents, EUR TTC (no currency field yet), at least 0, as the
  // landing's server computed it. With `pricing_valid_from`: both are required when `flow` is
  // estimate or fixed, and refused with quote or no flow.
  optional int64 quoted_cents = 5;
  // The day the pricing model that gave `quoted_cents` took effect, RFC 3339 full-date
  // ("2026-10-01").
  optional string pricing_valid_from = 6;
  // What the visitor picked for an estimate: input id → value id, the pricing model's slugs
  // (1–40 of [a-z0-9_-] each), at most 12 pairs, never free text. Only with flow estimate.
  map<string, string> estimate_inputs = 7;
  // The `distinct_id` of the landing's analytics beacon when the form was sent (a random id it
  // holds in memory, `crypto.randomUUID()`): 1–128 of [A-Za-z0-9._:-]. Not PII. The panel
  // sends the lead's later life to PostHog under it, so a visit and its lead are one person
  // there. Absent: the panel uses `sa-lead:<brand>:<lead>`.
  optional string analytics_id = 8;
  // The reference the customer carries into a messenger (MESSENGER-CHANNELS-SPEC §1): the
  // brand's 2–4 capital letters, a dash, 4–8 of Crockford base32 without I, L, O, U
  // (`^[A-Z]{2,4}-[0-9A-HJKMNP-TV-Z]{4,8}$`, e.g. "AQ-7K3F"). Made by the landing's form, so
  // not unique: `lead.messaged` and the lookup by ref name the brand's newest lead carrying
  // it. Not PII.
  optional string message_ref = 9;
  // The landing's locale, which language the panel writes to the customer in: `fr` or `en`
  // (anything else is refused). Absent: `fr`. Not PII.
  optional string locale = 10;
}

// lead.messaged@1 — the customer actually wrote the brand on a messenger. Written by a bot or
// the panel. subject.lead_id names the lead; or, absent, `message_ref` does, and the panel
// journals the event under the brand's newest lead carrying that ref (the lead id it found is
// what the journal keeps, so a rebuild does not look again). A ref no lead of the brand carries
// is `deferred` (the batch answered 409 with Retry-After, the event not journaled), the reason
// starting with `unknown_ref`: the landing's lead.created may not have arrived yet; send the
// same event again. Resolved by ref, the event takes the lead's location when it named none.
// A subject.lead_id the panel has no lead for is deferred the same way (`unknown_lead`). The
// customer's handle (a Telegram @username, a WhatsApp number or name) is PII: `pii.handle` /
// `pii.phone`, never here.
message LeadMessagedV1 {
  // whatsapp | telegram
  string channel = 1;
  // As in LeadCreatedV1. Required when subject.lead_id is absent.
  optional string message_ref = 2;
}

// lead.contacted@1 — subject.lead_id required.
message LeadContactedV1 {
  // phone | whatsapp | email | telegram | other
  optional string channel = 1;
}

// lead.quoted@1 — subject.lead_id required.
message LeadQuotedV1 {
  // In minor units of `currency`; both or neither.
  optional int64 amount = 1;
  // ISO 4217, e.g. "EUR".
  optional string currency = 2;
}

// job.won@1 — subject.lead_id and subject.job_id required.
message JobWonV1 {}

// lead.lost@1 — subject.lead_id required.
message LeadLostV1 {
  // Lowercase slug: no_answer, too_expensive, out_of_area, …
  string reason = 1;
  optional string note = 2;
}

// job.completed@1 — subject.lead_id and subject.job_id required.
message JobCompletedV1 {}

// payment.received@1 — subject.lead_id required.
message PaymentReceivedV1 {
  // What the customer paid, in minor units of `currency`; at least 0.
  int64 billed = 1;
  // Our share of it, in the same units; 0 to `billed`.
  int64 commission = 2;
  // ISO 4217, e.g. "EUR".
  string currency = 3;
}

// call.attempted@1 — an outgoing call started from the panel; subject.lead_id required.
message CallAttemptedV1 {}

// call.logged@1 — how a call ended, as the operator tells it; subject.lead_id required.
message CallLoggedV1 {
  // answered | no_answer | wrong_number | later
  string outcome = 1;
  // The id of the call.attempted event this closes, when there was one.
  optional string attempt_id = 2;
}

// ── experiments: configuration, not statistics (those are PostHog's) ───────────────────

// experiments.declared@1 — what a brand's landing runs, as its code declares it; sent by the
// landing (source.kind site) at every start, a new id each time. subject: the brand alone (no
// location, lead or job). The panel keeps the latest by occurred_at; an experiment the latest
// does not name is retired.
message ExperimentsDeclaredV1 {
  // At most 64, each key once.
  repeated ExperimentDeclaration experiments = 1;
}

message ExperimentDeclaration {
  // 1–64 of [a-z0-9_].
  string key = 1;
  // 2–32 unique names of 1–32 [a-z0-9_-]; the first is the control.
  repeated string variants = 2;
  // One per variant, each ≥ 0, their sum > 0.
  repeated double weights = 3;
  bool enabled = 4;
  // [0, 1).
  optional double holdout = 5;
  // The hypothesis, at most 200 characters.
  optional string summary = 6;
}

// experiment.configured@1 — an admin's change to one of the brand's experiments, written by the
// panel (source.kind panel, source.id the admin's concierge id, or `cli`). subject: the brand
// alone. A field absent is left as it was; named in `reset`, it follows the declaration again.
message ExperimentConfiguredV1 {
  string key = 1;
  optional bool enabled = 2;
  // 2–32 of them, each ≥ 0, their sum > 0; empty: not set by this change.
  repeated double weights = 3;
  // [0, 1).
  optional double holdout = 4;
  // enabled | weights | holdout.
  repeated string reset = 5;
  // Who, as the screens show them: the admin's email, or their concierge id when concierge gave
  // none (as a place's or a price list's history names them). An employee's, not PII. One line,
  // 1–320 characters.
  string by = 6;
}

// ── counts, from the retired PostHog import (spec §2 stages 3–4, §3.4, §7) ─────────────
//
// The panel no longer imports them (2026-10-04: what PostHog shows is looked at in PostHog).
// They stay registered so a journal holding them still passes and rebuilds; nothing is
// projected from them.
//
// One count of one UTC day and slice; never about a person, so never a lead or a job in the
// subject. A day is counted again while it is recent: a later count of the same slice comes
// as a new event with the next `revision`, and the projection keeps the highest. Counts are
// int64 (a JSON string or number), at least 0.

// site.metrics@1 — page views of a location (`location_page_view`) from one traffic source.
// subject.location_id: the location; absent for pages that name none.
message SiteMetricsV1 {
  // The UTC day, "2026-09-30".
  string day = 1;
  // Lowercase, 1–64 of [a-z0-9._:-]: utm_source, the referrer's host, direct, internal,
  // unknown, or "other" for whatever does not fit and for the tail past the 20 largest.
  string source = 2;
  int64 visits = 3;
  // 1, 2, …
  uint32 revision = 4;
}

// contact.metrics@1 — intents at a location (`contact_intent_click`) through one channel.
// subject.location_id as for site.metrics.
message ContactMetricsV1 {
  string day = 1;
  // phone | whatsapp | form_open | booking
  string channel = 2;
  int64 intents = 3;
  uint32 revision = 4;
}

// experiment.metrics@1 — one variant of one of the brand's experiments, forced (QA) visits
// left out. No subject.location_id: the server-side lead event names none.
message ExperimentMetricsV1 {
  string day = 1;
  // Lowercase slugs, as the landing names them ("quote_single_step", "b").
  string experiment = 2;
  string variant = 3;
  // Page views shown the variant (`experiment_exposed`).
  int64 exposures = 4;
  // Leads the landing stored under it (`experiment_lead`).
  int64 leads = 5;
  // Intents under it, by channel (`experiment_contact{channel}`).
  int64 phone = 6;
  int64 whatsapp = 7;
  int64 form_open = 8;
  int64 booking = 9;
  uint32 revision = 10;
}


// ── booking (FORM-VARIANTS-SPEC, "Booking providers contract") ──────────────────────────
//
// Provider: manual | link | google_calendar | cal_com, a closed vocabulary. Instants are
// RFC 3339 strings with an offset ("2026-10-06T14:30:00+02:00").

// booking.requested@1 — from a site (source.kind site), after the lead's lead.created: the
// visitor asked for a slot through `provider`, with an optional wish. No free text, no null.
// subject.lead_id required, and `lead_ref` is that same id: kitstart's leadRef,
// `lead-<row>-<8 lowercase hex>`, row ≥ 1. Rules normative in kitstart's
// test/fixtures/booking/README.md. Arriving before its lead.created, the batch is answered
// 409 (`deferred`) for the outbox to send again.
message BookingRequestedV1 {
  string lead_ref = 1;
  string provider = 2;
  // "YYYY-MM-DD", a real day, 2 days back to 366 ahead of its arrival; `manual` only.
  optional string preferred_date = 3;
  // morning | afternoon | evening; `manual` only.
  optional string preferred_part = 4;
}

// booking.created@1 — a provider says a slot is booked, or moved (the same external_ref with
// another start): written by the panel's adapters only (source.kind booking, source.id the
// provider). subject.lead_id: the lead it was matched to, absent while unmatched. The
// attendee's name, email and phone go in `pii`, never here.
message BookingCreatedV1 {
  // google_calendar | cal_com: a provider with an adapter.
  string provider = 1;
  // The provider's id of the booking (Google: the calendar event's id). 1–1024 of
  // [A-Za-z0-9._:-].
  string external_ref = 2;
  string start_at = 3;
  optional string end_at = 4;
  // ref | contact: how subject.lead_id was found; set exactly when it is.
  optional string match = 5;
  // The provider's revision of the booking (Google: the event's etag), 1–256 printable
  // ASCII: the same revision seen twice is one event.
  string version = 6;
  // When the customer booked, as the provider says (Google: the event's `created`).
  optional string booked_at = 7;
}

// booking.canceled@1 — a provider says a booking it reported is canceled. As booking.created.
message BookingCanceledV1 {
  string provider = 1;
  string external_ref = 2;
  string version = 3;
}

// booking.set@1 — an operator put the lead's slot in by hand (or moved it): it is booked.
// source.kind panel; subject.lead_id required.
message BookingSetV1 {
  string start_at = 1;
  optional string end_at = 2;
}

// booking.status_changed@1 — an operator closed a booked slot: done | no_show | canceled.
message BookingStatusChangedV1 {
  string status = 1;
}

// booking.cleared@1 — an operator took the lead's slot away: no booking any more.
message BookingClearedV1 {}

// booking.attached@1 — an operator joined a provider's booking to the lead (subject.lead_id):
// one the panel could not match, or one matched by contact that they confirm or correct.
message BookingAttachedV1 {
  string provider = 1;
  string external_ref = 2;
}
