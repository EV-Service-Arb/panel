[package]
name = "sa_contracts"
description = "concierge's gRPC contract, as the conductor signs its users in through it (tonic, from contracts/proto)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

# The generated code pulled in with `include!` uses these; machete cannot see into OUT_DIR.
[package.metadata.cargo-machete]
ignored = ["prost", "tonic", "tonic-prost"]

[dependencies]
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[lints]
workspace = true
